[package]
name = "numpad"
version = "1.4.0"
edition = "2024"
description = "A native calculation tape with comments and live totals"
license = "MIT"

[features]
# Read-only UI probes; never enabled in distributed builds.
e2e = []

[[test]]
name = "e2e"
harness = false
required-features = ["e2e"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "tokio", "tiny-skia", "x11", "wayland", "advanced-shaping", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bigdecimal = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-bigint = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
directories = "6"
rust_xlsxwriter = "0.94"
pdf-writer = "0.12"
subsetter = { version = "0.2", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Preserve panic isolation in background save and update workers.
panic = "unwind"
strip = true

[package.metadata.bundle]
name = "NumPad"
identifier = "app.numpad.desktop"
category = "Productivity"
short_description = "Calculate, annotate, and correct on an editable tape"

[[bench]]
name = "engine"
harness = false
