[package]
name = "numpad"
version = "1.3.1"
edition = "2024"
description = "A native calculation tape with comments and live totals"
license = "MIT"

[features]
# Read-only UI probes; never enabled in distributed builds.
e2e = []

[[test]]
name = "e2e"
harness = false
required-features = ["e2e"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "tokio", "tiny-skia", "x11", "wayland", "advanced-shaping", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bigdecimal = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"
directories = "6"
rust_xlsxwriter = "0.94"
printpdf = { version = "0.8", default-features = false }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[package.metadata.bundle]
name = "NumPad"
identifier = "app.numpad.desktop"
category = "Productivity"
short_description = "Calculate, annotate, and correct on an editable tape"
