name: Native builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Dependency security
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: python3 scripts/audit.py
  ui:
    if: github.event_name != 'schedule'
    name: Linux UI regression tests
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-ui
      - name: Install native and UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev xvfb xdotool imagemagick fonts-dejavu-core
      - name: Exercise the real application in an isolated display
        run: xvfb-run -a -s '-screen 0 1280x1200x24' cargo test --release --locked --features e2e --test e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-test-results
          path: test-results/e2e/
          if-no-files-found: ignore
  build:
    if: github.event_name != 'schedule'
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # shared-key overrides key; rotate only Intel's interrupted cache upload.
          shared-key: native-${{ matrix.os }}-${{ matrix.target }}${{ matrix.target == 'x86_64-apple-darwin' && '-intel-v2' || '' }}
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev shellcheck
      - name: Validate scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh scripts/update-unix.sh scripts/setup-nfpm.sh scripts/verify-linux-packages.sh scripts/package-macos.sh
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Windows updater replacement and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($scenario in @("success", "bad-checksum", "duplicate-checksum", "missing-executable", "replacement-fails", "invalid-version", "save-canceled")) {
            & pwsh -NoProfile -File tests/update_windows.tests.ps1 -Scenario $scenario
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Restore packaging tool
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/nfpm
          key: nfpm-2.47.0-linux-x86_64
      - name: Set up packaging tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh scripts/setup-nfpm.sh
          echo "$PWD/.tools/nfpm" >> "$GITHUB_PATH"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          binary="target/$TARGET/release/numpad"
          if [ "$PLATFORM" = windows ]; then binary="$binary.exe"; fi
          python scripts/package.py --binary "$binary" --platform "$PLATFORM" --arch "$ARCH" --output dist
      - name: Smoke-test native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          binary="target/$TARGET/release/numpad"
          if [ "$PLATFORM" = windows ]; then binary="$binary.exe"; fi
          "$binary" --export-demo test-results
          test -s test-results/sample.pdf
          test -s test-results/sample.xlsx
          test -s test-results/sample.numpad
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: sh scripts/verify-linux-packages.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NumPad-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ui, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: NumPad-*
          path: dist
          merge-multiple: true
      - run: python scripts/checksums.py dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/numpad-draft; then
            if [ "$(cat /tmp/numpad-draft)" != true ]; then
              echo "Release already published; refusing to replace public assets." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "NumPad $TAG" --notes-file packaging/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
